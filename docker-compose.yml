services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dictation
      POSTGRES_PASSWORD: dictation
      POSTGRES_DB: dictation
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dictation"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    # 默认含手写识别（RapidOCR/ONNX，内存约 100-150MB）；暂不需要识别可改用 dockerfile: Dockerfile
    build:
      context: ./server
      dockerfile: Dockerfile.recognition
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://dictation:dictation@db:5432/dictation
      JWT_SECRET: ${JWT_SECRET:-please-change-me-to-a-long-random-string}
      CORS_ORIGINS: "*"
      MIN_CONF: ${MIN_CONF:-0.5}
      VERDICT_MODE: ${VERDICT_MODE:-conservative}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./build/web:/srv:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  caddy_data:
  caddy_config:
